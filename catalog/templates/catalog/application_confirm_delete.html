{% extends "catalog/base_generic.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm bg-white p-4 text-center">
            <h3 class="fw-bold mb-3" style="color: #212529;">Подтверждение удаления</h3>
            <p class="text-secondary mb-4">Вы действительно хотите удалить вашу заявку "<strong>{{ application.title }}</strong>"? Данное действие невозможно отменить.</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-3">
                    <a href="{% url 'profile' %}" class="btn btn-light w-50 py-2 fw-semibold">Отмена</a>
                    <button type="submit" class="btn btn-danger w-50 py-2 fw-semibold">Да, удалить</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
