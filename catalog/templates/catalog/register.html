{% extends "catalog/base_generic.html" %}

{% block content %}
<div style="background: #fff; padding: 30px; border-radius: 6px; max-width: 500px; margin: 0 auto;">
    <h2 style="font-weight: bold; margin-bottom: 20px; color: #212529;">Регистрация</h2>

    <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #0d6efd; color: #fff; border: 0; padding: 10px 20px; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 15px;">Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
